name: Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    name: Run Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install asdf & tools
        uses: asdf-vm/actions/install@v4

      # Upgrade, not get: apps resolve the newest allowed versions, not this package's pubspec.lock
      - name: Install dependencies
        run: |
          flutter pub upgrade

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests (VM)
        run: dart test

      # - name: Run tests (JS/dart2js)
      #   run: dart test -P js

      # - name: Run tests (WASM/dart2wasm)
      #   run: dart test -P wasm
